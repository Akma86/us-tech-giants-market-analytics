name: Validate Environment and Data

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Data Integrity and Files
        run: |
          python -c "
          import pandas as pd
          from pathlib import Path
          
          data_file = Path('data/raw/us_tech_giants_daily_history.csv')
          assert data_file.exists(), 'Consolidated dataset does not exist'
          df = pd.read_csv(data_file)
          assert len(df) > 40000, f'Unexpected row count: {len(df)}'
          print(f'Verification passed: {len(df)} rows verified across tickers {df[\"Ticker\"].unique()}')
          "
